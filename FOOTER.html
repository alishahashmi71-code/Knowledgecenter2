<!-- ===================================================================
     Applied Industrial Technologies - Knowledge & Solutions Center
     FOOTER.html
     Paste ONCE into HubSpot: Settings > Website > Pages > Advanced >
     Footer HTML  (or the page-level Footer HTML field).
     Contains ALL page JavaScript. No CSS here.
     Everything is namespaced and guards for missing elements, so it is
     safe to load even on pages where a given module is absent.
     =================================================================== -->

<script>
(function () {
  "use strict";

  var prefersReduced = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function ready(fn) {
    if (document.readyState !== "loading") { fn(); }
    else { document.addEventListener("DOMContentLoaded", fn); }
  }

  /* ----------------------------------------------------------------
     1. SCROLL REVEAL (progressive enhancement)
     ---------------------------------------------------------------- */
  function initReveal() {
    document.body.classList.add("aih-animations-ready");
    var items = document.querySelectorAll(".aih-lp .aih-reveal");
    if (!items.length) return;

    function revealAll() {
      items.forEach(function (el) { el.classList.add("is-in"); });
    }

    if (prefersReduced || !("IntersectionObserver" in window)) {
      revealAll();
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add("is-in");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.01, rootMargin: "0px 0px -8% 0px" });
    items.forEach(function (el) { io.observe(el); });

    /* Safety net: never leave content hidden if the observer does not
       fire (some embedded/CMS contexts throttle IntersectionObserver). */
    window.setTimeout(revealAll, 1400);
  }

  /* ----------------------------------------------------------------
     2. SMOOTH SCROLL for opt-in in-page links [data-aih-scroll]
     ---------------------------------------------------------------- */
  function initSmoothScroll() {
    document.querySelectorAll(".aih-lp [data-aih-scroll]").forEach(function (a) {
      a.addEventListener("click", function (ev) {
        var id = a.getAttribute("href");
        if (!id || id.charAt(0) !== "#") return;
        var target = document.querySelector(id);
        if (!target) return;
        ev.preventDefault();
        target.scrollIntoView({
          behavior: prefersReduced ? "auto" : "smooth",
          block: "start"
        });
      });
    });
  }

  /* ----------------------------------------------------------------
     3. SPOTLIGHT CAROUSEL  (module 03)
     ---------------------------------------------------------------- */
  function initSpotlight() {
    var root = document.querySelector(".aih-lp [data-aih-spotlight]");
    if (!root) return;
    var slides = root.querySelectorAll(".aih-spotlight-slide");
    var dots = root.querySelectorAll(".aih-spotlight-dot");
    if (slides.length < 2) return;
    var idx = 0, timer = null, DURATION = 6500;

    function show(n) {
      idx = (n + slides.length) % slides.length;
      slides.forEach(function (s, i) { s.classList.toggle("is-active", i === idx); });
      dots.forEach(function (d, i) { d.setAttribute("aria-selected", i === idx ? "true" : "false"); });
    }
    function next() { show(idx + 1); }
    function start() {
      if (prefersReduced) return;
      stop();
      timer = window.setInterval(next, DURATION);
    }
    function stop() { if (timer) { window.clearInterval(timer); timer = null; } }

    dots.forEach(function (d, i) {
      d.addEventListener("click", function () { show(i); start(); });
    });
    root.addEventListener("mouseenter", stop);
    root.addEventListener("mouseleave", start);
    show(0);
    start();
  }

  /* ----------------------------------------------------------------
     4. FILTER SIDEBAR: accordion + supplier search + show more
     ---------------------------------------------------------------- */
  function initFilterUI() {
    var sidebar = document.querySelector(".aih-lp .aih-filters");
    if (!sidebar) return;

    /* accordion collapse/expand per group */
    sidebar.querySelectorAll(".aih-filter-legend").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var group = btn.closest(".aih-filter-group");
        if (group) group.classList.toggle("is-collapsed");
      });
    });

    /* supplier "Show more / Show less" */
    var moreBtn = sidebar.querySelector(".aih-filter-more");
    if (moreBtn) {
      moreBtn.addEventListener("click", function () {
        var group = moreBtn.closest(".aih-filter-group");
        if (!group) return;
        var expanded = group.classList.toggle("is-expanded");
        moreBtn.querySelector("[data-label]").textContent = expanded ? "Show less" : "Show more";
      });
    }

    /* supplier text search filters the checkbox list */
    var search = sidebar.querySelector(".aih-supplier-search");
    if (search) {
      search.addEventListener("input", function () {
        var q = search.value.trim().toLowerCase();
        var group = search.closest(".aih-filter-group");
        if (group && q) group.classList.add("is-expanded");
        sidebar.querySelectorAll('[data-supplier-row]').forEach(function (row) {
          var name = (row.getAttribute("data-supplier-row") || "").toLowerCase();
          row.style.display = (!q || name.indexOf(q) !== -1) ? "" : "none";
        });
      });
    }
  }

  /* ----------------------------------------------------------------
     5. KNOWLEDGE LIBRARY: live filtering inside a fixed scroll pane
     ---------------------------------------------------------------- */
  function initLibrary() {
    var library = document.querySelector(".aih-lp #aih-library");
    if (!library) return;

    var blocks = Array.prototype.slice.call(library.querySelectorAll(".aih-content-block"));
    var countEl = library.querySelector("[data-result-count]");
    var emptyEl = library.querySelector(".aih-results-empty");

    function getChecked(name) {
      var set = [];
      library.querySelectorAll('input[data-filter="' + name + '"]:checked').forEach(function (i) {
        set.push(i.value);
      });
      return set;
    }

    function cardMatches(card, industries, suppliers, types) {
      var cardInds = (card.getAttribute("data-industry") || "").split(/\s+/);
      var indOK = !industries.length || industries.indexOf("all") !== -1 ||
        industries.some(function (i) { return cardInds.indexOf(i) !== -1; });
      var supOK = !suppliers.length || suppliers.indexOf(card.getAttribute("data-supplier")) !== -1;
      var typeOK = !types.length || types.indexOf(card.getAttribute("data-type")) !== -1;
      return indOK && supOK && typeOK;
    }

    var COLLAPSED = 3; /* cards shown per section before "Show more" */

    function apply() {
      var industries = getChecked("industry");
      var suppliers = getChecked("supplier");
      var types = getChecked("type");
      var grandTotal = 0;

      blocks.forEach(function (block) {
        var expanded = block.classList.contains("is-expanded");
        var cards = Array.prototype.slice.call(block.querySelectorAll(".aih-card"));
        var matched = 0;
        cards.forEach(function (c) {
          var ok = cardMatches(c, industries, suppliers, types);
          var show = ok && (expanded || matched < COLLAPSED);
          c.classList.toggle("is-hidden", !show);
          if (ok) matched++;
        });
        grandTotal += matched;
        block.style.display = matched ? "" : "none";

        var wrap = block.querySelector(".aih-showmore-wrap");
        var btn = block.querySelector(".aih-showmore");
        if (wrap) wrap.hidden = matched <= COLLAPSED;   /* no button if it all fits */
        if (btn) {
          btn.textContent = expanded ? "Show less" : "Show more";
          btn.setAttribute("aria-expanded", expanded ? "true" : "false");
        }
      });

      if (countEl) countEl.textContent = grandTotal;
      if (emptyEl) emptyEl.classList.toggle("is-visible", grandTotal === 0);
    }

    /* "All Industries" behaves as a master toggle */
    library.querySelectorAll('input[data-filter="industry"]').forEach(function (input) {
      input.addEventListener("change", function () {
        if (input.value === "all" && input.checked) {
          library.querySelectorAll('input[data-filter="industry"]').forEach(function (o) {
            if (o.value !== "all") o.checked = false;
          });
        } else if (input.value !== "all" && input.checked) {
          var allBox = library.querySelector('input[data-filter="industry"][value="all"]');
          if (allBox) allBox.checked = false;
        }
        apply();
      });
    });

    /* supplier + type checkboxes re-filter live */
    library.querySelectorAll('input[data-filter="supplier"], input[data-filter="type"]').forEach(function (input) {
      input.addEventListener("change", apply);
    });

    /* per-section Show more / Show less -> expand block into a fixed-height scroll panel */
    library.querySelectorAll(".aih-showmore").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var block = btn.closest(".aih-content-block");
        if (!block) return;
        var nowExpanded = block.classList.toggle("is-expanded");
        apply();
        var grid = block.querySelector(".aih-card-grid");
        if (nowExpanded) {
          if (grid) grid.scrollTop = 0;
        } else {
          block.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "nearest" });
        }
      });
    });

    /* Apply button (mainly for mobile, also re-applies) */
    var applyBtn = library.querySelector(".aih-apply");
    if (applyBtn) applyBtn.addEventListener("click", function (e) {
      e.preventDefault();
      apply();
      var results = library.querySelector(".aih-results");
      if (results && window.innerWidth <= 768) {
        results.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
      }
    });

    /* Clear all */
    var clearBtn = library.querySelector(".aih-clear");
    if (clearBtn) clearBtn.addEventListener("click", function (e) {
      e.preventDefault();
      library.querySelectorAll('input[data-filter]').forEach(function (i) { i.checked = false; });
      var allBox = library.querySelector('input[data-filter="industry"][value="all"]');
      if (allBox) allBox.checked = true;
      var search = library.querySelector(".aih-supplier-search");
      if (search) { search.value = ""; search.dispatchEvent(new Event("input")); }
      apply();
    });

    apply(); /* initial paint */
  }

  /* ----------------------------------------------------------------
     6. YOUTUBE click-to-load facades  (module 05)
     ---------------------------------------------------------------- */
  function initVideoFacades() {
    document.querySelectorAll(".aih-lp .aih-video-facade[data-yt]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-yt");
        if (!id) return;
        var title = btn.getAttribute("data-yt-title") || "YouTube video";
        var iframe = document.createElement("iframe");
        iframe.className = "aih-video-frame";
        iframe.setAttribute("src",
          "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0");
        iframe.setAttribute("title", title);
        iframe.setAttribute("allow",
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
        iframe.setAttribute("allowfullscreen", "");
        iframe.setAttribute("loading", "lazy");
        btn.parentNode.replaceChild(iframe, btn);
      });
    });
  }

  ready(function () {
    initReveal();
    initSmoothScroll();
    initSpotlight();
    initFilterUI();
    initLibrary();
    initVideoFacades();
  });
})();
</script>
